<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles-contact.css">
</head>

<body>
    <header>
        <nav class="nav">
            <div class="the-navbar">
                <img src="bilder/bay_logo.png" alt="Bay Palace Hotel Logo" class="logo">
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="#">Rooms</a>
                    <a href="#">People</a>
                    <a href="contact.html">Contact</a>
                </div>
                <a class="cta-book" href="#">Book Now</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="contact">
            <h1>Call us</h1>
            <p class="phone">+53 256 22 41</p>
            <h2>Send an email:</h2>
            <form>
                <h3>Fill out the form</h3>
                <label for="first-name">First name</label>
                <input type="text" id="first-name" name="first-name">

                <label for="last-name">Last name</label>
                <input type="text" id="last-name" name="last-name">

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email">

                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone">

                <label for="booking-number">Booking number</label>
                <input type="text" id="booking-number" name="booking-number">

                <label for="message">Tell us something</label>
                <textarea id="message" name="message"></textarea>

                <button type="submit">Send</button>
            </form>
        </section>
    </main>

    <footer>
        <img src="bilder/bay_logo.png" alt="Bay Palace Hotel Logo" class="logo">
        <div class="footer-nav1">
            <a class="footer-navbar" href="#">Rooms</a>
            <a class="footer-navbar" href="#">All inclusive</a>
            <a class="footer-navbar" href="#">People</a>
        </div>
        <div class="footer-nav2">
            <a class="footer-navbar" href="contact.html">Contact</a>
            <a class="footer-navbar" href="#">Terms</a>
            <a class="footer-navbar" href="#">Privacy</a>
        </div>
        <p class="copyright">© Bay palace 2026</p>
    </footer>

</body>

</html>
